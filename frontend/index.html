<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a32">
  <meta name="description" content="Evidence-led decision rehearsal for executive teams.">
  <title>Counterfactual Boardroom</title>
  <link rel="icon" type="image/png" href="/frontend/boardroom-mark.png">
  <link rel="stylesheet" href="/frontend/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#home" aria-label="Counterfactual Boardroom home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="brand-copy"><strong>COUNTERFACTUAL</strong><small>BOARDROOM</small></span>
      </a>
      <div class="workspace-switch"><span class="workspace-avatar">N</span><span><strong>Northstar Group</strong><small>Enterprise workspace</small></span><b aria-hidden="true">⌄</b></div>
      <div class="nav-label">WORKSPACE</div>
      <nav class="primary-nav" aria-label="Main navigation">
        <button class="nav-item active" data-page="home"><span class="nav-icon">◫</span>Overview</button>
        <button class="nav-item" data-page="decisions"><span class="nav-icon">◈</span>Decision Studio</button>
        <button class="nav-item" data-page="scenarios"><span class="nav-icon">⑂</span>Scenario Lab</button>
        <button class="nav-item" data-page="impact"><span class="nav-icon">◎</span>Impact Map</button>
        <button class="nav-item" data-page="briefings"><span class="nav-icon">▤</span>Briefing Room</button>
      </nav>
      <div class="nav-label governance-label">GOVERNANCE</div>
      <nav class="primary-nav" aria-label="Governance navigation">
        <button class="nav-item" data-page="approvals"><span class="nav-icon">✓</span>Approvals <span class="nav-count" id="approval-count">2</span></button>
        <button class="nav-item" data-page="audit"><span class="nav-icon">◷</span>Audit trail</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="environment-card"><span class="status-dot"></span><span><strong>Prototype environment</strong><small>Illustrative data · no live models</small></span></div>
        <button class="user-profile" type="button"><span class="user-avatar">AM</span><span><strong>Alex Morgan</strong><small>Decision owner</small></span><b>•••</b></button>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <button id="mobile-menu" class="mobile-menu" aria-label="Toggle navigation">☰</button>
        <div class="breadcrumb"><span>Northstar Group</span><b>/</b><strong id="breadcrumb-current">Overview</strong></div>
        <div class="top-actions"><span class="data-status"><i></i>Data current as of 31 Oct 2026</span><button class="icon-button" aria-label="Notifications">♧<em></em></button><button class="help-button" aria-label="Help">?</button></div>
      </header>
      <section id="page-content" class="page-content" aria-live="polite">
        <div class="loading-state"><span class="loader"></span>Loading decision portfolio…</div>
      </section>
    </main>
  </div>
  <div class="toast-region" id="toast-region" aria-live="polite"></div>
  <script src="/frontend/app.js" defer></script>
  <script src="/frontend/briefing-notes.js" defer></script>
  <script src="/frontend/data-actions.js" defer></script>
</body>
</html>
